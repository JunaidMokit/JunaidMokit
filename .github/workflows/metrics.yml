name: GitHub Analytics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: JunaidMokit
          template: classic
          base: header, activity, repositories, metadata
          config_timezone: Asia/Dhaka
